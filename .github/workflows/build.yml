name: Build and Release Vexa Launcher

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Certificate
        shell: pwsh
        run: |
          $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.PFX_BASE64 }}")
          [System.IO.File]::WriteAllBytes("${{ github.workspace }}\Sertifika.pfx", $pfx_cert_byte)

      - name: Build and Sign
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Bu komut bizim hazırladığımız build-and-sign.ps1'i tetikler
          npm run build-and-sign -- -pfxPath "${{ github.workspace }}\Sertifika.pfx" -pfxKey "${{ secrets.PFX_PASSWORD }}"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            build/fix.ps1
          name: Vexa Launcher ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
