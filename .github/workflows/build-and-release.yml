name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.1.15"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Release Tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like v1.2.3. Got: $env:RELEASE_TAG"
          }

      - name: Ensure Manual Tag Exists
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git tag $env:RELEASE_TAG
            git push origin "refs/tags/$env:RELEASE_TAG"
          }


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Clean Build Output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue

      - name: Create Runtime Env
        shell: pwsh
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          $clientId = if (-not [string]::IsNullOrWhiteSpace($env:DISCORD_CLIENT_ID)) { $env:DISCORD_CLIENT_ID } else { "1472302829392629924" }
          "DISCORD_CLIENT_ID=$clientId" | Set-Content -Path .env -Encoding utf8

      - name: Build Setup Installers (64-bit and 32-bit)
        run: npm run build

      - name: Clean Unwanted Artifacts
        shell: pwsh
        run: |
          Remove-Item -Force dist/vexa-setup.exe -ErrorAction SilentlyContinue
          Remove-Item -Force dist/*.blockmap -ErrorAction SilentlyContinue
          Get-ChildItem dist/

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Vexa Client ${{ env.RELEASE_TAG }}"
          body_path: launcher/patch-notes.md
          files: |
            dist/vexa-setup-x64.exe
            dist/vexa-setup-ia32.exe
