name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build and Publish All (Launcher + Client)
        run: npm run build:full
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Vexa Client ${{ github.ref_name }}"
          body: |
            ## 🚀 Vexa Client ${{ github.ref_name }}

            Vexa'nın bu sürümünü aşağıdaki bağlantıdan indirebilirsiniz.

            ### 📥 Kurulum
            1. `vexa-launcher-setup-*.exe` dosyasını indirin
            2. Kurulumu çalıştırın
            3. Launcher açıldıktan sonra **İNDİR** butonuna basın, oyun dosyaları otomatik kurulur

            ### ✨ Özellikler
            - Sınırsız FPS desteği (monitör yenileme hızına tam uyum)
            - Otomatik güncelleme sistemi
            - Discord Rich Presence (Discord'da anlık oyun durumu)
            - Reklamsız oyun deneyimi
            - Sohbet kısayolları: `/a` (avatar), `/e` (extrapolation)

            ### ⚠️ Antivirüs Uyarısı
            Windows "Bilinmeyen Yayıncı" uyarısı verebilir. Bu normal bir durumdur, **"Yine de Çalıştır"** diyerek devam edebilirsiniz.

            ---
            📌 Sorun yaşarsanız [Discord sunucumuza](https://vexaclient.rf.gd/discord) katılın.
          files: |
            dist/*.exe
            app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


