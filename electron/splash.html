<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Vexa HaxBall Client — Yükleniyor</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #070707; /* Tamamen mat, dipsiz siyah */
    --text-pure: #ffffff; /* Saf beyaz */
    --text-dim: #606060; /* Kömür grisi */
    --line-dim: #1c1c1c; /* Koyu gri ince çizgi */
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background-color: var(--bg-color);
    color: var(--text-pure);
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Barlow Condensed', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* Herhangi bir kutu yok, elemanlar direkt ekranda */
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.6s ease;
  }

  /* Çıkış yaparken sadece hafifçe bulanıklaşıp kaybolur */
  .container.leaving {
    opacity: 0;
    transform: scale(1.04);
    filter: blur(4px);
  }

  .logo {
    font-family: 'Michroma', sans-serif;
    font-size: 28px;
    letter-spacing: 9px;
    margin-bottom: 50px;
    display: flex;
    align-items: center;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.15s forwards;
  }
  
  .logo-vexa { color: var(--text-pure); }
  .logo-client { color: var(--text-dim); margin-left: 10px; }

  .progress-area {
    width: 270px;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.3s forwards;
  }

  /* İnce net arka plan çizgisi */
  .bar {
    width: 100%;
    height: 2px; 
    background-color: var(--line-dim);
    position: relative;
    overflow: hidden;
    margin-bottom: 22px;
    border-radius: 2px;
  }

  /* Akıcı şekilde kayan saf beyaz ilerleme çizgisi */
  .bar-fill {
    width: 40%;
    height: 100%;
    background-color: var(--text-pure);
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.85);
    position: absolute;
    left: -40%;
    border-radius: 2px;
    animation: slide 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }

  @keyframes slide {
    0% { left: -40%; }
    100% { left: 100%; }
  }

  .bar-fill.finish {
    animation: none !important;
    left: 0 !important;
    width: 100% !important;
    transition: width 0.35s ease-out;
  }

  .status {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 6px;
    color: var(--text-dim);
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.45s forwards;
  }

  /* Hazır olduğunda renk beyaza döner ve harf arası hafif açılır */
  .status.done {
    color: var(--text-pure);
    letter-spacing: 8px;
    transition: all 0.35s ease;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>

  <div class="container" id="container">
    <div class="logo">
      <span class="logo-vexa">VEXA</span>
      <span class="logo-client">CLIENT</span>
    </div>

    <div class="progress-area">
      <div class="bar">
        <div class="bar-fill" id="barFill"></div>
      </div>
      <div class="status" id="status">YÜKLENİYOR</div>
    </div>
  </div>

  <script>
    const container = document.getElementById('container');
    const barFill   = document.getElementById('barFill');
    const status    = document.getElementById('status');

    window.vexaClientReady = function () {
      barFill.classList.add('finish');
      status.textContent = 'HAZIR';
      status.classList.add('done');
      
      // Akıcı bir çıkış efekti
      setTimeout(() => {
        container.classList.add('leaving');
      }, 450);
    };

    window.addEventListener('message', (event) => {
      if (event.data === 'ready') {
        window.vexaClientReady();
      }
    });

    window.setSplashStatus = function (data) {
      if (!data) return;
      if (typeof data === 'string') data = { status: data };
      if (data.status) status.textContent = data.status;
      
      // Yalnızca indirme işlemi yapılırken çubuğu yüzdeye bağla
      if (typeof data.percent === 'number' && data.percent > 0 && data.percent < 100) {
        barFill.style.animation = 'none';
        barFill.style.left = '0';
        barFill.style.width = data.percent + '%';
      }
    };
  </script>
</body>
</html>
