<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexa Launcher</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="shell">
        <div class="title-bar">
            <div class="brand">
                <div class="brand-mark">V</div>
                <div class="brand-copy">
                    <strong>Vexa</strong>
                    <span>Launcher</span>
                </div>
            </div>
            <div class="window-controls">
                <button id="minimize" class="control-btn" aria-label="Küçült">−</button>
                <button id="close" class="control-btn close" aria-label="Kapat">×</button>
            </div>
        </div>

        <div class="layout">
            <aside class="notes-panel">
                <div class="panel-label">Yama Notları</div>
                <div id="patch-notes" class="patch-notes-content">Yama notları yükleniyor...</div>
            </aside>

            <main class="hero-panel">
                <div class="release-pill">Latest Release</div>

                <section class="status-panel">
                    <p class="eyebrow">Vexa Client</p>
                    <h1 id="status-text">GÜNCELLEMELER KONTROL EDİLİYOR...</h1>
                    <p id="version-text">Sürüm: --</p>
                </section>

                <section class="action-panel">
                    <div id="progress-container" class="progress-wrap hidden">
                        <div class="progress-meta">
                            <span>İndirme durumu</span>
                            <strong id="progress-label">0%</strong>
                        </div>
                        <div class="progress-bar">
                            <div id="progress-fill" class="progress-fill"></div>
                        </div>
                        <div id="progress-details" class="progress-details">Hazırlanıyor...</div>
                    </div>

                    <button id="action-btn" class="play-btn disabled">OYNA</button>
                </section>
            </main>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
